<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Count Proyektor — PASMANTAB e-VOTING 2026</title>
  <link rel="icon" type="image/png" href="../assets/logo-pasmantab.png" />
  <link rel="stylesheet" href="../css/tokens.css?v=7" />
  <link rel="stylesheet" href="../css/main.css?v=7" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #271016 0%, #141417 65%);
      color: #FFFFFF;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .projector-topbar {
      background: rgba(20, 20, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .projector-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .projector-brand img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #FFFFFF;
      padding: 2px;
    }

    .projector-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .speed-select {
      min-height: 40px;
      padding: 0.35rem 0.75rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      cursor: pointer;
    }

    .speed-select option {
      background: #18181B;
      color: #FFFFFF;
    }

    .btn-glass {
      min-height: 40px;
      padding: 0.4rem 0.9rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .btn-glass:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-gold-glass {
      min-height: 40px;
      padding: 0.4rem 0.95rem;
      border-radius: 10px;
      background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      color: #FFFFFF;
      border: 1px solid #FBBF24;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
      transition: transform 160ms ease, filter 160ms ease;
    }

    .btn-gold-glass:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .projector-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .ballot-stage {
      background: linear-gradient(145deg, rgba(107, 20, 38, 0.42) 0%, rgba(24, 24, 27, 0.92) 100%);
      border: 1px solid rgba(243, 208, 215, 0.22);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.75rem;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1.25rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 768px) {
      .ballot-stage {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

    .virtual-ballot-card {
      background: #FFFFFF;
      color: #18181B;
      border-radius: 14px;
      padding: 1.1rem 1.4rem;
      border-left: 6px solid #C81E1E;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .virtual-ballot-card.pop {
      transform: scale(1.02);
    }

    .ballot-meta-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: #6B1426;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .ballot-choice-headline {
      font-family: var(--font-heading);
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
      font-weight: 800;
      color: #18181B;
    }

    .stage-counter-box {
      text-align: right;
      min-width: 190px;
    }

    @media (max-width: 768px) {
      .stage-counter-box {
        text-align: center;
      }
    }

    .stage-counter-num {
      font-family: var(--font-heading);
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.1;
      color: #FFFFFF;
    }

    .stage-counter-label {
      font-size: 0.78rem;
      color: #D4D4D8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 0.25rem;
    }

    .projector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
      gap: 1.35rem;
    }

    .proj-card {
      background: #FFFFFF;
      color: #18181B;
      border-radius: 18px;
      padding: 1.5rem;
      border: 2px solid transparent;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
      position: relative;
      overflow: hidden;
    }

    .proj-card.flash-vote {
      transform: translateY(-4px) scale(1.015);
      border-color: #C81E1E;
      box-shadow: 0 0 0 5px rgba(200, 30, 30, 0.28), 0 18px 36px rgba(0, 0, 0, 0.4);
    }

    .proj-card.winner-card {
      border-color: #D97706;
      background: linear-gradient(180deg, #FFFBEB 0%, #FFFFFF 45%);
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.35), 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    .winner-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .proj-cand-top {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .proj-photo {
      width: 78px;
      height: 78px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid #E4E4E7;
      flex-shrink: 0;
    }

    .proj-avatar {
      width: 78px;
      height: 78px;
      border-radius: 14px;
      background: var(--color-burgundy-gradient);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 1.65rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .proj-num-tag {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: #6B1426;
      background: #FDF2F4;
      border: 1px solid #F3D0D7;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 0.3rem;
    }

    .proj-cand-name {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 800;
      color: #18181B;
      line-height: 1.25;
    }

    .proj-score-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .proj-vote-count {
      font-family: var(--font-heading);
      font-size: 2.6rem;
      font-weight: 800;
      color: #18181B;
      line-height: 1;
    }

    .proj-vote-unit {
      font-size: 0.9rem;
      font-weight: 600;
      color: #71717A;
      margin-left: 0.35rem;
    }

    .proj-vote-pct {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 700;
      color: #6B1426;
    }

    .proj-bar-track {
      width: 100%;
      height: 16px;
      background: #F3F4F6;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #E4E4E7;
    }

    .proj-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6B1426 0%, #C81E1E 100%);
      border-radius: 999px;
      transition: width 240ms cubic-bezier(0.2, 0, 0, 1);
    }

    .proj-card.winner-card .proj-bar-fill {
      background: linear-gradient(90deg, #B45309 0%, #F59E0B 100%);
    }

    /* ========================================================================
       PANGGUNG SINEMATIK PENGESAHAN KETUA TERPILIH
       ======================================================================== */
    .ceremony-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at center, #4A0D18 0%, #140609 65%, #070304 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      animation: fadeOverlayIn 350ms ease forwards;
    }

    .ceremony-overlay.hidden {
      display: none !important;
    }

    .ceremony-overlay.screen-shake {
      animation: stageImpactShake 600ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Kanvas kembang api berada DI DEPAN kartu (z-index: 7) dengan pointer-events: none */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 7;
    }

    .ceremony-flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 251, 235, 1) 0%, rgba(251, 191, 36, 0.75) 45%, rgba(200, 30, 30, 0.25) 75%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 8;
    }

    .ceremony-flash.trigger {
      animation: flashExplosion 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .ceremony-sunburst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 170vmax;
      height: 170vmax;
      margin-top: -85vmax;
      margin-left: -85vmax;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(245, 158, 11, 0.11) 0deg 8deg,
        transparent 8deg 18deg
      );
      animation: spinClockwise 40s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    /* GELOMBANG KEJUT TERPUSAT */
    .shockwave-ring {
      position: fixed;
